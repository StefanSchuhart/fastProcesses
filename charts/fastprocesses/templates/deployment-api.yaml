apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "fastprocesses.fullname" . }}-api
  labels:
    {{- include "fastprocesses.selectorLabels" . | nindent 4 }}
    component: api
    {{- with .Values.podLabels.api }}
    {{- toYaml . | nindent 4 }}
    {{- end }}

spec:
  selector:
    matchLabels:
      {{- include "fastprocesses.selectorLabels" . | nindent 6 }}
      component: api
  template:
    metadata:
      labels:
        {{- include "fastprocesses.selectorLabels" . | nindent 8 }}
        component: api
    spec:
      {{- with .Values.image.pullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.nodeSelector.api }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations.api }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: {{ .Chart.Name }}-api
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          {{- if .Values.api.command }}
          command:
            {{- toYaml .Values.api.command | nindent 12 }}
          {{- else }}
          command:
            - uvicorn
            - app:app
            - --host
            - "0.0.0.0"
            - --port
            - "8000"
            - --workers
            - "1"
            - --log-level
            - info
            {{- with .Values.api.extraArgs }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- end }}
          ports:
            - name: http
              containerPort: {{ .Values.service.port }}
              protocol: TCP
          {{- if .Values.probes.api.liveness.enabled }}
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          {{- end }}
          envFrom:
            - configMapRef:
                name: {{ include "fastprocesses.fullname" . }}
          env:
            - name: CELERY_BROKER_PASSWORD
              {{- if .Values.config.celery.existingSecret }}
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.config.celery.existingSecret }}
                  key: {{ .Values.config.celery.existingSecretKey }}
              {{- else }}
              value: ""
              {{- end }}
            - name: RESULT_CACHE_PASSWORD
              {{- if .Values.config.resultCache.existingSecret }}
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.config.resultCache.existingSecret }}
                  key: {{ .Values.config.resultCache.existingSecretKey }}
              {{- else }}
              value: ""
              {{- end }}
            {{- with .Values.api.extraEnvVars }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          resources:
            {{- toYaml .Values.resources.api | nindent 12 }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            {{- with .Values.api.extraVolumeMounts }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
      volumes:
        - name: tmp
          emptyDir: {}
        {{- with .Values.api.extraVolumes }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
