{{- if and .Values.autoscaling.worker.keda.enabled (not .Values.autoscaling.worker.keda.useScaledJob) }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "fastprocesses.fullname" . }}-worker
  labels:
    {{- include "fastprocesses.selectorLabels" . | nindent 4 }}
    component: worker
    {{- with .Values.podLabels.worker }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  {{- if not .Values.autoscaling.api.hpa.enabled }}
  replicas: {{ .Values.replicaCount.api }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "fastprocesses.selectorLabels" . | nindent 6 }}
      component: worker
  template:
    metadata:
      labels:
        {{- include "fastprocesses.selectorLabels" . | nindent 8 }}
        component: worker
    spec:
      {{- with .Values.image.pullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.nodeSelector.worker }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations.worker }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: {{ .Chart.Name }}-worker
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          {{- if .Values.worker.command }}
          command:
            {{- toYaml .Values.worker.command | nindent 12 }}
          {{- else }}
          command:
            - celery
            - -A
            - fastprocesses.worker.celery_app
            - worker
            - "--loglevel={{ .Values.config.celery.logLevel }}"
            - --concurrency=1
            - -Q
            - {{ join "," .Values.worker.queues | quote }}
          {{- end }}
          env:
            - name: CELERY_BROKER_PASSWORD
              {{- if .Values.config.celery.existingSecret }}
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.config.celery.existingSecret }}
                  key: {{ .Values.config.celery.existingSecretKey }}
              {{- else }}
              value: ""
              {{- end }}
            - name: RESULT_CACHE_PASSWORD
              {{- if .Values.config.resultCache.existingSecret }}
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.config.resultCache.existingSecret }}
                  key: {{ .Values.config.resultCache.existingSecretKey }}
              {{- else }}
              value: ""
              {{- end }}
            {{- with .Values.worker.extraEnvVars }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          envFrom:
            - configMapRef:
                name: {{ include "fastprocesses.fullname" . }}
          resources:
            {{- toYaml .Values.resources.worker | nindent 12 }}
          volumeMounts:
            - name: memory-volume
              mountPath: /tmp
            {{- with .Values.worker.extraVolumeMounts }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
      volumes:
        - name: memory-volume
          emptyDir:
            medium: Memory  # Use memory-based storage
            sizeLimit: 500Mi
        {{- with .Values.worker.extraVolumes }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
{{- end }}